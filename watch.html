<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="disabled-adaptations" content="watch">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Brawl Mini</title>
<style>
  /* Watch edition: one dark screen, controls along the bottom edge. No web fonts (watchOS ignores them). */
  :root {
    --bg: #07060f; --fg: #f1ecff; --muted: #a69cc8;
    --p1: #ff2d6f; --p2: #2de2ff; --gold: #ffd166; --line: rgba(190, 170, 255, 0.22);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  /* A plain, normally scrolling page, so the Digital Crown scrolls the menus like any website.
     During a fight the menus are hidden and everything left is position: fixed, so there's
     nothing to scroll; touch-action stops swipes from doing anything there. */
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; }
  html:not(.scroll), html:not(.scroll) body { touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 3px;
    padding: 0 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
  #pad button { flex: 1; height: 40px; min-width: 0; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255, 255, 255, 0.08); color: var(--fg); font: 700 15px -apple-system, system-ui, sans-serif; padding: 0; touch-action: none; }
  #pad button.on { background: rgba(255, 255, 255, 0.28); }
  #pad .atk { color: var(--gold); }
  #bS { position: fixed; left: 50%; bottom: 50px; transform: translateX(-50%);
    width: 58%; max-width: 160px; height: 34px; border: 0; border-radius: 17px; padding: 0;
    background: var(--gold); color: #1a1000; font: 900 15px -apple-system, system-ui, sans-serif; letter-spacing: 0.06em;
    box-shadow: 0 0 14px rgba(255, 209, 102, 0.7); touch-action: none; animation: glow 0.5s infinite alternate; }
  #bS.on { transform: translateX(-50%) scale(0.94); }
  @keyframes glow { from { box-shadow: 0 0 6px rgba(255, 209, 102, 0.5); } to { box-shadow: 0 0 18px rgba(255, 209, 102, 0.95); } }

  .overlay { position: relative; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    gap: 7px; padding: calc(12px + var(--top, 0px)) 12px 12px; text-align: center; background: rgba(7, 6, 15, 0.86); }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .logo { margin: 0; font-size: 26px; line-height: 0.95; font-weight: 900; letter-spacing: 0.02em; color: var(--p1); }
  .logo span { display: block; color: var(--p2); }
  .overlay button { width: 100%; max-width: 220px; height: 40px; border-radius: 20px; border: 0;
    font: 700 16px -apple-system, system-ui, sans-serif; color: #14040b; background: var(--p1); }
  .overlay button.alt { background: rgba(255, 255, 255, 0.12); color: var(--fg); border: 1px solid var(--line); font-size: 14px; height: 34px; }
  .overlay button.blue { background: var(--p2); }
  .overlay button:disabled { opacity: 0.4; }
  .overlay p { margin: 0; font-size: 11px; line-height: 1.35; color: var(--muted); max-width: 220px; }
  .overlay h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; }
  .sep { width: 100%; max-width: 220px; height: 1px; background: var(--line); margin: 3px 0; }
  .join { display: flex; gap: 4px; width: 100%; max-width: 220px; }
  .join input { flex: 1; min-width: 0; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.5);
    color: var(--fg); font: 700 15px -apple-system, system-ui, sans-serif; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; padding: 0 6px; -webkit-user-select: text; user-select: text; }
  .join input::placeholder { letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 600; font-size: 13px; }
  .overlay .join button { width: auto; padding: 0 12px; height: 34px; font-size: 14px; background: var(--p2); }
  .msg { color: var(--gold) !important; }
  .msg:empty { display: none; }
  #lbCode { color: var(--gold); letter-spacing: 0.12em; font-size: 26px; -webkit-user-select: text; user-select: text; }
  #lbList { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; font-weight: 700; width: 100%; max-width: 220px; }
  #lbList small { color: var(--muted); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="bS" hidden aria-label="Super attack">SUPER</button>

<div id="pad" hidden>
  <button id="bL" aria-label="Move left">◀</button>
  <button id="bR" aria-label="Move right">▶</button>
  <button id="bP" class="atk" aria-label="Punch">P</button>
  <button id="bK" class="atk" aria-label="Kick">K</button>
</div>

<div id="menu" class="overlay">
  <h1 class="logo">NEON<span>BRAWL</span></h1>
  <button id="go">Fight</button>
  <button id="fighters" class="alt">Fighters: 2</button>
  <button id="diff" class="alt">CPU: Normal</button>
  <div class="sep"></div>
  <button id="host" class="blue">Host room</button>
  <form id="joinForm" class="join">
    <input id="code" maxlength="5" placeholder="Room code" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Room code">
    <button type="submit">Join</button>
  </form>
  <p id="netMsg" class="msg" aria-live="polite"></p>
  <p>◀ ▶ walk toward or away from the nearest fighter. Holding away blocks. Tap the arena to jump. Tap SUPER when your meter is full. Rooms work with friends on computers or watches.</p>
</div>

<div id="lobby" class="overlay" hidden>
  <p class="eyebrow" id="lbRole">Hosting</p>
  <h2 id="lbCode">·····</h2>
  <p id="lbHelp"></p>
  <ol id="lbList"></ol>
  <button id="lbFighters" class="alt">Fighters: 2</button>
  <button id="lbStart">Start</button>
  <p id="lbNote" class="msg"></p>
  <button id="lbLeave" class="alt">Leave</button>
</div>

<div id="over" class="overlay" hidden>
  <h2>Match over</h2>
  <button id="bAgain">Rematch</button>
  <button id="bLeave" class="alt">Leave</button>
</div>

<script src="sim.js"></script>
<script src="net.js"></script>
<script src="watch.js"></script>
</body>
</html>
